name: Hardened security gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardened-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-ci-fixture
          POSTGRES_DB: aegis_test
        ports: ["127.0.0.1:15432:5432"]
        options: >-
          --user 999:999
          --cap-drop ALL --security-opt no-new-privileges
          --memory 512m --pids-limit 128
          --health-cmd "pg_isready -U postgres -d aegis_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AEGIS_TEST_DATABASE_URL: postgresql+psycopg://postgres:ephemeral-ci-fixture@127.0.0.1:15432/aegis_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.13.18"}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip check
      - run: python -m ruff format --check apps scripts tests infrastructure/database/migrations
      - run: python -m ruff check apps scripts tests
      - run: python -m mypy apps scripts
      - run: python -m scripts.isolation
      - run: python -m scripts.zap_scope
      - run: python -m pytest --junitxml=artifacts/ci/junit.xml --cov=apps/core --cov=apps/hardened --cov-report=xml:artifacts/ci/coverage.xml
      - run: python -m bandit -r apps/core apps/hardened apps/lab_control apps/simulator scripts -q -f json -o artifacts/ci/bandit.json
      - run: python -m pip_audit -r requirements.lock --disable-pip -f json -o artifacts/ci/pip-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: hardened-python-evidence, path: artifacts/, retention-days: 14}

  hardened-container-and-zap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.13.18"}
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m scripts.lab init
      - run: python -m scripts.isolation --resolved
      - name: Build and start only hardened application and its prerequisites
        run: docker compose -p aegis -f compose.yml up -d --build --wait --wait-timeout 180 hardened
      - run: python -m scripts.isolation --resolved --runtime --scope hardened
      - name: Assert hardened image excludes training package
        run: docker compose -p aegis -f compose.yml exec -T hardened python -c "import importlib.util; assert importlib.util.find_spec('apps.vulnerable') is None"
      - name: Authenticated passive ZAP inspection of explicit local target
        run: |
          chmod 0777 artifacts/zap
          python -m scripts.lab scan --target hardened
      - name: Stop local containers
        if: always()
        run: docker compose -p aegis -f compose.yml down --remove-orphans
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: hardened-zap-observations, path: artifacts/zap/, retention-days: 14}
